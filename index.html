<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Números Primos y Mayor/Menor</title>
</head>
<body>
    <h1>Calculadora de Números Primos y Comparación</h1>

    <!-- Formulario para ingresar los dos números -->
    <form id="formNumeros">
        <div>
            <label for="num1">Ingrese el primer número:</label>
            <input type="number" id="num1" required>
        </div>
        <br>
        <div>
            <label for="num2">Ingrese el segundo número:</label>
            <input type="number" id="num2" required>
        </div>
        <br>
        <button type="submit">Calcular</button>
    </form>

    <h2>Resultados:</h2>
    <div id="resultado">
        <!-- Aquí mostraremos los resultados en pantalla -->
    </div>

    <!-- Script ubicado al final del body -->
    <script src="ejemplo.js/ejemplo.js"></script>
</body>
</html>
